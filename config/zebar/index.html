<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body,
            #bar {
                margin: 0;
                height: 100%;
                background: #282a36;
                color: #f8f8f2;
                font-family: "Segoe UI", sans-serif;
                font-size: 20px;
            }

            #bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                box-sizing: border-box;
            }

            #workspaces {
                display: flex;
                align-items: center;
                gap: 4px;
                min-width: 0;
            }

            #right {
                display: flex;
                align-items: center;
                gap: 12px;
                white-space: nowrap;
            }

            #resources {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #bfbfbf;
            }

            #resources span {
                font-variant-numeric: tabular-nums;
            }

            #resources .label {
                color: #6272a4;
                margin-right: 4px;
            }

            button {
                border: 0;
                background: #282a36;
                color: #bfbfbf;
                padding: 4px 10px;
                font: inherit;
                cursor: pointer;
            }

            button.unread {
                background: #ff5555;
                color: #f8f8f2;
            }

            button.displayed {
                background: #44475a;
                color: #f8f8f2;
            }

            button.focused {
                background: #6272a4;
                color: #f8f8f2;
            }

            #systray {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            #systray img {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }

            #tray {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            #tray button {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 34px;
                padding: 0 8px;
                border-radius: 4px;
                color: #f8f8f2;
                line-height: 1.15;
            }

            #tray button:hover {
                background: #44475a;
            }

            #tray button[hidden] {
                display: none;
            }

            #tray .icon {
                font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
                font-size: 16px;
            }

            #tray .small {
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }

            #clock {
                align-items: flex-end !important;
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <div id="workspaces"></div>
            <div id="right">
                <div id="resources">
                    <span id="weather"><span class="label">TMP</span>--</span>
                    <span id="cpu"><span class="label">CPU</span>--</span>
                    <span id="memory"><span class="label">MEM</span>--</span>
                </div>
                <div id="systray"></div>
                <div id="tray">
                    <button id="language">
                        <span class="small" id="language-name"></span>
                    </button>
                    <button id="network">
                        <span class="icon" id="network-icon"></span>
                    </button>
                    <button id="volume">
                        <span class="icon" id="volume-icon"></span>
                    </button>
                    <button id="battery" hidden>
                        <span class="icon" id="battery-icon"></span>
                    </button>
                    <button id="clock">
                        <span class="small" id="clock-time"></span>
                        <span class="small" id="clock-date"></span>
                    </button>
                </div>
            </div>
        </div>
        <script type="module">
            import * as zebar from "https://esm.sh/zebar@3";

            const providers = zebar.createProviderGroup({
                glazewm: { type: "glazewm" },
                cpu: { type: "cpu", refreshInterval: 2000 },
                memory: { type: "memory", refreshInterval: 2000 },
                date: { type: "date", refreshInterval: 1000 },
                systray: { type: "systray" },
                keyboard: { type: "keyboard", refreshInterval: 500 },
                network: { type: "network", refreshInterval: 3000 },
                battery: { type: "battery", refreshInterval: 10000 },
                weather: { type: "weather" },
            });

            const workspaces = document.getElementById("workspaces");
            const cpuEl = document.getElementById("cpu");
            const memoryEl = document.getElementById("memory");
            const systrayEl = document.getElementById("systray");
            const weatherEl = document.getElementById("weather");
            const languageEl = document.getElementById("language");
            const networkEl = document.getElementById("network");
            const volumeEl = document.getElementById("volume");
            const batteryEl = document.getElementById("battery");
            const clockEl = document.getElementById("clock");

            // Must match the powershell argsRegex in zpack.json exactly.
            const PRESS_WIN_SPACE =
                "$q=[char]34; Add-Type -Name K -Namespace W -MemberDefinition ('[DllImport(' + $q + 'user32.dll' + $q + ')] public static extern void keybd_event(byte k, byte s, uint f, System.UIntPtr e);'); [W.K]::keybd_event(0x5B, 0, 0, [UIntPtr]::Zero); [W.K]::keybd_event(0x20, 0, 0, [UIntPtr]::Zero); [W.K]::keybd_event(0x20, 0, 2, [UIntPtr]::Zero); [W.K]::keybd_event(0x5B, 0, 2, [UIntPtr]::Zero)";

            function openUri(uri) {
                zebar.shellExec("explorer", uri).catch(console.error);
            }

            languageEl.addEventListener("click", () => {
                zebar
                    .shellExec("powershell", [
                        "-NoProfile",
                        "-NonInteractive",
                        "-WindowStyle",
                        "Hidden",
                        "-Command",
                        PRESS_WIN_SPACE,
                    ])
                    .catch(console.error);
            });
            languageEl.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                openUri("ms-settings:regionlanguage");
            });

            networkEl.addEventListener("click", () =>
                openUri("ms-availablenetworks:")
            );
            networkEl.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                openUri("ms-settings:network");
            });

            volumeEl.addEventListener("click", () => {
                zebar.shellExec("sndvol", "-f").catch(console.error);
            });
            volumeEl.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                openUri("ms-settings:sound");
            });
            volumeEl.addEventListener("auxclick", (event) => {
                if (event.button !== 1 || !playback || !volumeProc) {
                    return;
                }
                const muted = !playback.muted;
                playback = { ...playback, muted };
                renderVolume();
                volumeProc.write(`m ${muted ? "1" : "0"}\n`);
            });
            volumeEl.addEventListener("wheel", (event) => {
                if (!playback || !volumeProc) {
                    return;
                }
                const step = event.deltaY < 0 ? 2 : -2;
                const volume = Math.min(
                    100,
                    Math.max(0, Math.round(playback.volume) + step)
                );
                playback = { ...playback, volume };
                renderVolume();
                volumeProc.write(`v ${volume}\n`);
            });

            batteryEl.addEventListener("click", () =>
                openUri("ms-settings:batterysaver")
            );

            clockEl.addEventListener("click", () =>
                openUri("ms-actioncenter:")
            );
            clockEl.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                openUri("ms-settings:dateandtime");
            });

            const unreadWorkspaces = new Set();
            const previousWindowIdsByWorkspace = new Map();
            const workspaceButtons = new Map();
            let workspaceLayoutKey = "";
            let trackedWindows = false;

            function pct(value) {
                return Number.isFinite(value) ? `${Math.round(value)}%` : "--";
            }

            function collectWindowIds(node, ids = []) {
                if (!node) {
                    return ids;
                }
                if (node.type === "window") {
                    ids.push(node.id);
                }
                if (Array.isArray(node.children)) {
                    for (const child of node.children) {
                        collectWindowIds(child, ids);
                    }
                }
                return ids;
            }

            function updateUnread(wm) {
                const focusedName = wm.focusedWorkspace?.name;
                if (focusedName) {
                    unreadWorkspaces.delete(focusedName);
                }

                const seen = new Set();
                for (const workspace of wm.allWorkspaces ?? []) {
                    seen.add(workspace.name);
                    const ids = new Set(collectWindowIds(workspace));
                    const previous = previousWindowIdsByWorkspace.get(
                        workspace.name
                    );

                    if (trackedWindows && previous) {
                        for (const id of ids) {
                            if (
                                !previous.has(id) &&
                                workspace.name !== focusedName
                            ) {
                                unreadWorkspaces.add(workspace.name);
                            }
                        }
                    }

                    if (ids.size === 0) {
                        unreadWorkspaces.delete(workspace.name);
                    }

                    previousWindowIdsByWorkspace.set(workspace.name, ids);
                }

                for (const name of [...previousWindowIdsByWorkspace.keys()]) {
                    if (!seen.has(name)) {
                        previousWindowIdsByWorkspace.delete(name);
                        unreadWorkspaces.delete(name);
                    }
                }

                trackedWindows = true;
            }

            function render() {
                const output = providers.outputMap;
                const wm = output.glazewm;
                if (wm) {
                    updateUnread(wm);
                }

                const currentWorkspaces = wm?.currentWorkspaces ?? [];
                const layoutKey = JSON.stringify(
                    currentWorkspaces.map(({ name, displayName }) => [
                        name,
                        displayName,
                    ])
                );
                if (layoutKey !== workspaceLayoutKey) {
                    workspaceLayoutKey = layoutKey;
                    workspaceButtons.clear();
                    workspaces.replaceChildren();
                    for (const workspace of currentWorkspaces) {
                        const button = document.createElement("button");
                        button.textContent =
                            workspace.displayName ?? workspace.name;
                        workspaceButtons.set(workspace.name, button);
                        button.addEventListener("click", () => {
                            unreadWorkspaces.delete(workspace.name);
                            button.classList.remove("unread");
                            const currentWm = providers.outputMap.glazewm;
                            Promise.resolve(
                                currentWm?.runCommand(
                                    `focus --workspace ${workspace.name}`
                                )
                            ).catch(console.error);
                        });
                        workspaces.appendChild(button);
                    }
                }

                for (const workspace of currentWorkspaces) {
                    const button = workspaceButtons.get(workspace.name);
                    if (!button) {
                        continue;
                    }
                    button.className =
                        wm?.focusedWorkspace?.name === workspace.name
                            ? "focused"
                            : wm?.displayedWorkspace?.name === workspace.name
                            ? "displayed"
                            : unreadWorkspaces.has(workspace.name)
                            ? "unread"
                            : "";
                }

                cpuEl.innerHTML = `<span class="label">CPU</span>${pct(
                    output.cpu?.usage
                )}`;
                memoryEl.innerHTML = `<span class="label">MEM</span>${pct(
                    output.memory?.usage
                )}`;
                renderSystray(output.systray);
                renderWeather(output.weather);
                renderLanguage(output.keyboard);
                renderNetwork(output.network);
                renderVolume();
                renderBattery(output.battery);
                renderClock(output.date);
            }

            function renderWeather(weather) {
                const temp = weather?.celsiusTemp;
                weatherEl.innerHTML = `<span class="label">TMP</span>${
                    Number.isFinite(temp) ? `${Math.round(temp)}°` : "--"
                }`;
            }

            function renderLanguage(keyboard) {
                const layout = (keyboard?.layout ?? "").toLowerCase();
                const label = layout.startsWith("el")
                    ? "GR"
                    : layout.startsWith("en")
                    ? "EN"
                    : "";
                document.getElementById("language-name").textContent = label;
                languageEl.hidden = label === "";
            }

            function renderNetwork(network) {
                const icon = document.getElementById("network-icon");
                const iface = network?.defaultInterface;
                const gateway = network?.defaultGateway;
                if (!iface) {
                    icon.textContent = "\uF384";
                    networkEl.title = "Not connected";
                    return;
                }
                if (iface.type === "wifi") {
                    const signal = gateway?.signalStrength ?? 100;
                    icon.textContent =
                        signal >= 75
                            ? "\uE701"
                            : signal >= 50
                            ? "\uE874"
                            : signal >= 25
                            ? "\uE873"
                            : "\uE872";
                    networkEl.title = `${
                        gateway?.ssid ?? "Wi-Fi"
                    }\nSignal ${Math.round(signal)}%`;
                    return;
                }
                icon.textContent = "\uE839";
                networkEl.title = iface.friendlyName ?? "Ethernet";
            }

            // Zebar 3.3.1 crashes when its audio provider is told there is no
            // default device. volume.ps1 reads the endpoint without that callback.
            let playback = null;
            let volumeProc = null;
            let volumeReady = false;

            function renderVolume() {
                const icon = document.getElementById("volume-icon");
                if (!playback) {
                    icon.textContent = "\uEA85";
                    volumeEl.title = "No audio device";
                    return;
                }
                const volume = Math.round(playback.volume);
                icon.textContent = playback.muted
                    ? "\uE74F"
                    : volume === 0
                    ? "\uE992"
                    : volume < 34
                    ? "\uE993"
                    : volume < 67
                    ? "\uE994"
                    : "\uE995";
                volumeEl.title = `${
                    playback.muted ? "Muted" : `${volume}%`
                }\nScroll to change, middle-click to mute`;
            }

            function applyVolumeLine(line) {
                const text = String(line ?? "").trim();
                if (!text) {
                    return;
                }
                volumeReady = true;
                if (text === "none") {
                    playback = null;
                    renderVolume();
                    return;
                }
                const [volumeText, mutedText] = text.split(" ");
                const volume = Number(volumeText);
                if (!Number.isFinite(volume)) {
                    return;
                }
                playback = { volume, muted: mutedText === "1" };
                renderVolume();
            }

            function startVolume() {
                const script = zebar
                    .currentWidget()
                    .htmlPath.replace(/[^\\/]*$/, "volume.ps1");
                zebar
                    .shellSpawn("powershell", [
                        "-NoProfile",
                        "-NonInteractive",
                        "-WindowStyle",
                        "Hidden",
                        "-ExecutionPolicy",
                        "Bypass",
                        "-File",
                        script,
                    ])
                    .then((proc) => {
                        volumeProc = proc;
                        proc.onStdout(applyVolumeLine);
                        proc.onStderr((line) => console.error(line));
                        proc.onExit(() => {
                            if (volumeProc !== proc) {
                                return;
                            }
                            volumeProc = null;
                            if (!volumeReady) {
                                return;
                            }
                            volumeReady = false;
                            setTimeout(startVolume, 1000);
                        });
                    })
                    .catch(console.error);
            }

            function renderBattery(battery) {
                if (!battery || !Number.isFinite(battery.chargePercent)) {
                    batteryEl.hidden = true;
                    return;
                }
                batteryEl.hidden = false;
                const percent = Math.round(battery.chargePercent);
                const level = Math.min(10, Math.floor(percent / 10));
                const charging = [
                    "\uE85A",
                    "\uE85B",
                    "\uE85C",
                    "\uE85D",
                    "\uE85E",
                    "\uE85F",
                    "\uE860",
                    "\uE861",
                    "\uE862",
                    "\uE83E",
                    "\uEA93",
                ];
                document.getElementById("battery-icon").textContent =
                    battery.isCharging
                        ? charging[level]
                        : level === 10
                        ? "\uE83F"
                        : String.fromCharCode(0xe850 + level);
                batteryEl.title = `${percent}%${
                    battery.isCharging ? " (charging)" : ""
                }`;
            }

            const timeFormat = new Intl.DateTimeFormat(undefined, {
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23",
            });
            const dateFormat = new Intl.DateTimeFormat(undefined, {
                weekday: "long",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
            });
            const longDateFormat = new Intl.DateTimeFormat(undefined, {
                dateStyle: "full",
            });

            function renderClock(date) {
                const now = new Date(date?.now ?? Date.now());
                document.getElementById("clock-time").textContent =
                    timeFormat.format(now);
                const dateParts = Object.fromEntries(
                    dateFormat
                        .formatToParts(now)
                        .map(({ type, value }) => [type, value])
                );
                document.getElementById(
                    "clock-date"
                ).textContent = `${dateParts.weekday} ${dateParts.day}/${dateParts.month}/${dateParts.year}`;
                clockEl.title = longDateFormat.format(now);
            }

            let systrayKey = "";

            function renderSystray(systray) {
                const icons = systray?.icons ?? [];
                const key = icons
                    .map(
                        (icon) => `${icon.id}:${icon.iconHash}:${icon.tooltip}`
                    )
                    .join("|");
                if (key === systrayKey) {
                    return;
                }
                systrayKey = key;

                systrayEl.replaceChildren();
                for (const icon of icons) {
                    const img = document.createElement("img");
                    img.src = icon.iconUrl;
                    img.title = icon.tooltip ?? "";
                    img.addEventListener("click", () =>
                        providers.outputMap.systray?.onLeftClick(icon.id)
                    );
                    img.addEventListener("dblclick", () =>
                        providers.outputMap.systray?.onLeftDoubleClick(icon.id)
                    );
                    img.addEventListener("auxclick", (event) => {
                        if (event.button === 1) {
                            providers.outputMap.systray?.onMiddleClick(icon.id);
                        }
                    });
                    img.addEventListener("contextmenu", (event) => {
                        event.preventDefault();
                        providers.outputMap.systray?.onRightClick(icon.id);
                    });
                    img.addEventListener("mouseenter", () =>
                        providers.outputMap.systray?.onHoverEnter(icon.id)
                    );
                    img.addEventListener("mouseleave", () =>
                        providers.outputMap.systray?.onHoverLeave(icon.id)
                    );
                    systrayEl.appendChild(img);
                }
            }

            providers.onOutput(render);
            render();
            startVolume();
        </script>
    </body>
</html>
