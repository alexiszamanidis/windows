name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          )

          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "install.ps1 contains PowerShell syntax errors."
          }

          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $analysis = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning,Error
          if ($analysis) {
            $analysis | Format-Table -AutoSize
            throw "PSScriptAnalyzer found issues."
          }

      - name: Test installer behavior
        shell: pwsh
        run: |
          $packages = @(
            Get-Content ./packages.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )

          if ($packages.Count -eq 0) {
            throw "packages.txt contains no package IDs."
          }

          $duplicates = $packages | Group-Object | Where-Object Count -gt 1
          if ($duplicates) {
            throw "packages.txt contains duplicate IDs: $($duplicates.Name -join ', ')"
          }

          $global:wingetCalls = [System.Collections.Generic.List[string]]::new()
          function global:winget {
            $global:wingetCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return "  NAME      STATE           VERSION"
            }
          }

          & ./install.ps1

          if ($global:wingetCalls.Count -ne $packages.Count) {
            throw "Expected $($packages.Count) WinGet calls, got $($global:wingetCalls.Count)."
          }

          foreach ($id in $packages) {
            if (-not ($global:wingetCalls -match "--id $([regex]::Escape($id)) --exact")) {
              throw "install.ps1 did not request the exact package ID '$id'."
            }
          }

          if (-not ($global:wslCalls -match "--set-default-version 2")) {
            throw "install.ps1 did not set WSL2 as the default version."
          }

          if (-not ($global:wslCalls -match "--install --distribution Ubuntu --no-launch --web-download")) {
            throw "install.ps1 did not request Ubuntu on WSL."
          }

          if ($global:wslCalls -match "ansible") {
            throw "install.ps1 invoked Ansible. Ubuntu install should stop before Linux packages."
          }

          function Get-ProvisionedTerminalSettings {
            $packagesRoot = Join-Path $env:LOCALAPPDATA "Packages"
            $knownFamily = Join-Path $packagesRoot "Microsoft.WindowsTerminal_8wekyb3d8bbwe"
            $familyPath = $knownFamily
            if (-not (Test-Path $knownFamily)) {
              $family = Get-ChildItem -Path $packagesRoot -Directory -Filter "Microsoft.WindowsTerminal_*" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike "*Preview*" } |
                Select-Object -First 1
              if (-not $family) {
                throw "Windows Terminal settings directory was not created."
              }
              $familyPath = $family.FullName
            }

            $settingsPath = Join-Path $familyPath "LocalState\settings.json"
            if (-not (Test-Path -LiteralPath $settingsPath)) {
              throw "Windows Terminal settings were not written."
            }

            return [System.IO.File]::ReadAllText($settingsPath)
          }

          $terminalSettings = Get-ProvisionedTerminalSettings
          if ($terminalSettings -notmatch "Hack Nerd Font Mono") {
            throw "Windows Terminal settings do not use Hack Nerd Font Mono."
          }
          if ($terminalSettings -notmatch "2c4de342-38b7-51cf-b940-2309a097f518") {
            throw "Windows Terminal settings do not use the Ubuntu profile GUID."
          }
          if ($terminalSettings -match "Ubuntu 20.04|DroidSansMono|__WSL_") {
            throw "Windows Terminal settings still contain a stale profile or placeholder."
          }
          $fontPath = Join-Path $env:LOCALAPPDATA "Microsoft\Windows\Fonts\HackNerdFontMono-Regular.ttf"
          if (-not (Test-Path -LiteralPath $fontPath)) {
            throw "Hack Nerd Font Mono was not installed."
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return @(
                "  NAME      STATE           VERSION"
                "* Ubuntu    Stopped         2"
              )
            }
          }

          & ./install.ps1

          if ($global:wslCalls -match "--distribution Ubuntu") {
            throw "install.ps1 tried to install Ubuntu even though it is already installed."
          }

          if (-not ($global:wslCalls -match "--set-default Ubuntu")) {
            throw "install.ps1 did not keep Ubuntu as the default WSL distro."
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return @(
                "  NAME      STATE           VERSION"
                "  Ubuntu-24.04    Stopped         1"
              )
            }
          }

          & ./install.ps1

          if ($global:wslCalls -match "--distribution Ubuntu") {
            throw "install.ps1 installed a second Ubuntu distro."
          }

          if (-not ($global:wslCalls -match "--set-version Ubuntu-24.04 2")) {
            throw "install.ps1 did not convert Ubuntu-24.04 to WSL2."
          }

          if (-not ($global:wslCalls -match "--set-default Ubuntu-24.04")) {
            throw "install.ps1 did not keep Ubuntu-24.04 as the default WSL distro."
          }

          $versionedSettings = Get-ProvisionedTerminalSettings
          if ($versionedSettings -notmatch "963ff2f7-6aed-5ce3-9d91-90d99571f53a") {
            throw "Windows Terminal settings were not regenerated for Ubuntu-24.04."
          }
          if ($versionedSettings -notmatch "wsl.exe -d Ubuntu-24.04") {
            throw "Windows Terminal profile was not pointed at Ubuntu-24.04."
          }

          $rebootOutput = pwsh -NoProfile -Command @'
          $ErrorActionPreference = "Stop"
          function global:winget { $global:LASTEXITCODE = 0 }
          function global:wsl {
            $global:LASTEXITCODE = 1
            if ($args -contains "--no-distribution") {
              return "Changes will not be effective until the system is rebooted."
            }
            return "The Windows Subsystem for Linux is not installed."
          }
          & ./install.ps1 *>&1 | ForEach-Object { "$_" }
          '@ | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "WSL reboot path failed with exit code ${LASTEXITCODE}: $rebootOutput"
          }
          if ($rebootOutput -notmatch "Restart Windows, then run this installer again to install Ubuntu") {
            throw "WSL reboot path did not report that a restart is required: $rebootOutput"
          }
          if ($rebootOutput -match "Installing Ubuntu for WSL") {
            throw "WSL reboot path continued into the Ubuntu install."
          }

      - name: Verify packages exist in WinGet
        shell: pwsh
        run: |
          winget source update --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Could not update WinGet sources."
          }

          $packages = Get-Content ./packages.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith("#") }

          foreach ($id in $packages) {
            Write-Host "Checking $id"
            winget show --id $id --exact --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              throw "WinGet package '$id' could not be resolved."
            }
          }
