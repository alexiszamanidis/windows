name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $scripts = @(
            "./install.ps1"
            "./tests/install.Tests.ps1"
            "./config/flow-launcher-hotkey.ps1"
          ) + @(Get-ChildItem ./tasks/*.ps1 | ForEach-Object { $_.FullName })

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "$script contains PowerShell syntax errors."
            }
          }

          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          foreach ($script in $scripts) {
            $exclude = @()
            if ((Split-Path -Leaf $script) -eq "install.Tests.ps1") {
              $exclude = @("PSAvoidGlobalFunctions")
            }
            $analysis = Invoke-ScriptAnalyzer -Path $script -Severity Warning,Error -ExcludeRule $exclude
            if ($analysis) {
              $analysis | Format-Table -AutoSize
              throw "PSScriptAnalyzer found issues in $script."
            }
          }

      - name: Unit tests
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester -or $pester.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester -Path ./tests/install.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing tests."
          }

      - name: Test installer behavior
        shell: pwsh
        run: |
          $packages = @(
            Get-Content ./config/packages.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )

          if ($packages.Count -eq 0) {
            throw "packages.txt contains no package IDs."
          }

          $duplicates = $packages | Group-Object | Where-Object Count -gt 1
          if ($duplicates) {
            throw "packages.txt contains duplicate IDs: $($duplicates.Name -join ', ')"
          }

          $node = Import-PowerShellDataFile ./config/node.psd1
          $gitConfig = Import-PowerShellDataFile ./config/git.psd1
          $wslConfig = Import-PowerShellDataFile ./config/wsl.psd1
          $packageOptions = Import-PowerShellDataFile ./config/packages.psd1
          $distribution = [string]$wslConfig.Distribution
          if ([string]::IsNullOrWhiteSpace([string]$node.Version) -or [string]::IsNullOrWhiteSpace([string]$node.PackageId)) {
            throw "config/node.psd1 must set Version and PackageId."
          }
          if ([string]::IsNullOrWhiteSpace($distribution)) {
            throw "config/wsl.psd1 must set Distribution."
          }
          if ($packages -contains [string]$node.PackageId) {
            throw "config/node.psd1 PackageId is also listed in packages.txt. The Node task owns that package."
          }

          $global:wingetCalls = [System.Collections.Generic.List[string]]::new()
          function global:winget {
            $global:wingetCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return "  NAME      STATE           VERSION"
            }
          }

          $global:nvmCalls = [System.Collections.Generic.List[string]]::new()
          function global:nvm {
            $global:nvmCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
          }

          & ./install.ps1

          if ($global:wingetCalls.Count -ne $packages.Count) {
            throw "Expected $($packages.Count) WinGet calls, got $($global:wingetCalls.Count)."
          }
          $expectedNvm = "install $($node.Version),use $($node.Version)"
          if (($global:nvmCalls -join ",") -ne $expectedNvm) {
            throw "The Node task did not install and select Node.js $($node.Version) through nvm."
          }

          foreach ($id in $packages) {
            if (-not ($global:wingetCalls -match "--id $([regex]::Escape($id)) --exact")) {
              throw "install.ps1 did not request the exact package ID '$id'."
            }
          }

          foreach ($id in $packageOptions.Keys) {
            $option = $packageOptions[$id]
            $call = @($global:wingetCalls | Where-Object { $_ -match "--id $([regex]::Escape([string]$id)) " })
            if ($call.Count -ne 1) {
              throw "install.ps1 did not request the package '$id' once."
            }
            if ($option.Source -and $call[0] -notmatch "--source $([regex]::Escape([string]$option.Source))( |$)") {
              throw "$id was not installed from source '$($option.Source)'."
            }
            if ($option.Silent -and $call[0] -notmatch "--silent") {
              throw "$id was not installed silently."
            }
            if ($option.Custom -and $call[0] -notmatch "--custom $([regex]::Escape([string]$option.Custom))( |$)") {
              throw "$id was not installed with custom argument '$($option.Custom)'."
            }
          }

          if (-not ($global:wslCalls -match "--set-default-version 2")) {
            throw "install.ps1 did not set WSL2 as the default version."
          }

          if (-not ($global:wslCalls -match "--install --distribution $([regex]::Escape($distribution)) --no-launch --web-download")) {
            throw "install.ps1 did not request $distribution on WSL."
          }

          if ($global:wslCalls -match "ansible") {
            throw "install.ps1 invoked Ansible. Ubuntu install should stop before Linux packages."
          }

          function Get-ProvisionedTerminalSettings {
            $packagesRoot = Join-Path $env:LOCALAPPDATA "Packages"
            $knownFamily = Join-Path $packagesRoot "Microsoft.WindowsTerminal_8wekyb3d8bbwe"
            $familyPath = $knownFamily
            if (-not (Test-Path $knownFamily)) {
              $family = Get-ChildItem -Path $packagesRoot -Directory -Filter "Microsoft.WindowsTerminal_*" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike "*Preview*" } |
                Select-Object -First 1
              if (-not $family) {
                throw "Windows Terminal settings directory was not created."
              }
              $familyPath = $family.FullName
            }

            $settingsPath = Join-Path $familyPath "LocalState\settings.json"
            if (-not (Test-Path -LiteralPath $settingsPath)) {
              throw "Windows Terminal settings were not written."
            }

            return [System.IO.File]::ReadAllText($settingsPath)
          }

          $terminalSettings = Get-ProvisionedTerminalSettings
          . ./tasks/Terminal.ps1
          $distributionGuid = (Get-WslTerminalProfileGuid -DistroName $distribution).Trim("{}")
          if ($terminalSettings -notmatch "Hack Nerd Font Mono") {
            throw "Windows Terminal settings do not use Hack Nerd Font Mono."
          }
          if ($terminalSettings -notmatch [regex]::Escape($distributionGuid)) {
            throw "Windows Terminal settings do not use the profile GUID for $distribution."
          }
          if ($terminalSettings -notmatch [regex]::Escape("wsl.exe -d $distribution")) {
            throw "Windows Terminal profile was not pointed at $distribution."
          }
          if ($terminalSettings -match "Ubuntu 20.04|DroidSansMono|__WSL_") {
            throw "Windows Terminal settings still contain a stale profile or placeholder."
          }
          $fontPath = Join-Path $env:LOCALAPPDATA "Microsoft\Windows\Fonts\HackNerdFontMono-Regular.ttf"
          if (-not (Test-Path -LiteralPath $fontPath)) {
            throw "Hack Nerd Font Mono was not installed."
          }

          foreach ($name in $gitConfig.Keys) {
            $value = git config --global --get $name
            if ($LASTEXITCODE -ne 0 -or $value -ne [string]$gitConfig[$name]) {
              throw "Git $name is '$value', expected '$($gitConfig[$name])'."
            }
          }

          $flowSettings = Join-Path $env:APPDATA "FlowLauncher\Settings\Settings.json"
          if (-not (Test-Path -LiteralPath $flowSettings)) {
            throw "Flow Launcher settings were not written."
          }
          $flowJson = [System.IO.File]::ReadAllText($flowSettings)
          if ($flowJson -notmatch '"Hotkey": "Win \+ P"') {
            throw "Flow Launcher hotkey is not Win+P."
          }
          if ($flowJson -notmatch '"StartFlowLauncherOnSystemStartup": true') {
            throw "Flow Launcher was not set to start at login."
          }
          $flowHook = Join-Path $env:APPDATA "WindowsSetup\flow-launcher-hotkey.ps1"
          if (Test-Path -LiteralPath $flowHook) {
            $hookText = [System.IO.File]::ReadAllText($flowHook)
            if ($hookText -notmatch "SearchWindows") {
              throw "Win+Shift+P does not search open windows."
            }
          } elseif ($flowJson -notmatch '"Hotkey": "Win \+ Shift \+ P"' -or $flowJson -notmatch '"ActionKeyword": "w "') {
            throw "Flow Launcher was not set to search open windows."
          }
          $walker = Join-Path $env:APPDATA "FlowLauncher\Plugins\Flow.Plugin.WindowWalker\plugin.json"
          if (-not (Test-Path -LiteralPath $walker)) {
            throw "Window Walker was not installed."
          }
          $disabledHotkeys = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced").DisabledHotkeys
          if ($disabledHotkeys.IndexOf("P") -lt 0) {
            throw "Win+P was not disabled. DisabledHotkeys is '$disabledHotkeys'."
          }

          $glazeConfig = Join-Path $env:USERPROFILE ".glzr\glazewm\config.yaml"
          if (-not (Test-Path -LiteralPath $glazeConfig)) {
            throw "GlazeWM config was not deployed."
          }
          $glazeText = [System.IO.File]::ReadAllText($glazeConfig)
          if ($glazeText -notmatch "display_name: '1: chrome'" -or
              $glazeText -notmatch "display_name: '10: brave'" -or
              $glazeText -notmatch "show_all_in_taskbar: true" -or
              $glazeText -match "keep_alive:\s*true" -or
              $glazeText -notmatch "shell-exec zebar" -or
              $glazeText -notmatch "top: '40px'") {
            throw "GlazeWM config does not keep the i3 workspaces."
          }
          $chromeStartup = Join-Path $env:USERPROFILE ".glzr\glazewm\chrome-startup.ps1"
          if (-not (Test-Path -LiteralPath $chromeStartup)) {
            throw "Chrome startup script was not deployed."
          }
          $zebarSettings = Join-Path $env:USERPROFILE ".glzr\zebar\settings.json"
          $zebarPack = Join-Path $env:USERPROFILE ".glzr\zebar\workspaces\index.html"
          if (-not (Test-Path -LiteralPath $zebarSettings) -or -not (Test-Path -LiteralPath $zebarPack)) {
            throw "The workspace bar was not installed."
          }
          $zebarText = [System.IO.File]::ReadAllText($zebarSettings)
          if ($zebarText -notmatch '"pack": "workspaces"') {
            throw "Zebar was not set to open the workspace bar."
          }
          if ($glazeText -match "'lwin\+p'" -or $glazeText -match "'lwin\+l'") {
            throw "GlazeWM config binds a shortcut reserved for Flow Launcher or the Windows lock screen."
          }

          $inputLeapConfig = Join-Path $env:LOCALAPPDATA "InputLeap\input-leap.sgc"
          if (-not (Test-Path -LiteralPath $inputLeapConfig)) {
            throw "Input Leap layout was not deployed."
          }
          $inputLeapText = [System.IO.File]::ReadAllText($inputLeapConfig)
          if ($inputLeapText -notmatch "(?m)^    Desktop:" -or $inputLeapText -notmatch "(?m)^    lg9hp6m3-ath.int.openbet.com:" -or $inputLeapText -notmatch "right = lg9hp6m3-ath.int.openbet.com") {
            throw "Input Leap layout does not place the Linux client to the right of Desktop."
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return @(
                "  NAME      STATE           VERSION"
                "* $distribution    Stopped         2"
              )
            }
          }

          & ./install.ps1

          if ($global:wslCalls -match "--distribution $([regex]::Escape($distribution))( |$)") {
            throw "install.ps1 tried to install $distribution even though it is already installed."
          }

          if (-not ($global:wslCalls -match "--set-default $([regex]::Escape($distribution))( |$)")) {
            throw "install.ps1 did not keep $distribution as the default WSL distro."
          }

          $versionedDistribution = "$distribution-24.04"
          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          function global:wsl {
            $global:wslCalls.Add(($args -join " "))
            $global:LASTEXITCODE = 0
            if ($args -contains "--list") {
              return @(
                "  NAME      STATE           VERSION"
                "  $versionedDistribution    Stopped         1"
              )
            }
          }

          & ./install.ps1

          if ($global:wslCalls -match "--distribution $([regex]::Escape($distribution))( |$)") {
            throw "install.ps1 installed a second $distribution distro."
          }

          if (-not ($global:wslCalls -match "--set-version $([regex]::Escape($versionedDistribution)) 2")) {
            throw "install.ps1 did not convert $versionedDistribution to WSL2."
          }

          if (-not ($global:wslCalls -match "--set-default $([regex]::Escape($versionedDistribution))( |$)")) {
            throw "install.ps1 did not keep $versionedDistribution as the default WSL distro."
          }

          $versionedSettings = Get-ProvisionedTerminalSettings
          $versionedGuid = (Get-WslTerminalProfileGuid -DistroName $versionedDistribution).Trim("{}")
          if ($versionedSettings -notmatch [regex]::Escape($versionedGuid)) {
            throw "Windows Terminal settings were not regenerated for $versionedDistribution."
          }
          if ($versionedSettings -notmatch [regex]::Escape("wsl.exe -d $versionedDistribution")) {
            throw "Windows Terminal profile was not pointed at $versionedDistribution."
          }

          $rebootOutput = pwsh -NoProfile -Command @'
          $ErrorActionPreference = "Stop"
          function global:winget { $global:LASTEXITCODE = 0 }
          function global:nvm { $global:LASTEXITCODE = 0 }
          function global:wsl {
            $global:LASTEXITCODE = 1
            if ($args -contains "--no-distribution") {
              return "Changes will not be effective until the system is rebooted."
            }
            return "The Windows Subsystem for Linux is not installed."
          }
          & ./install.ps1 *>&1 | ForEach-Object { "$_" }
          '@ | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "WSL reboot path failed with exit code ${LASTEXITCODE}: $rebootOutput"
          }
          if ($rebootOutput -notmatch [regex]::Escape("Restart Windows, then run this installer again to install $distribution")) {
            throw "WSL reboot path did not report that a restart is required: $rebootOutput"
          }
          if ($rebootOutput -match [regex]::Escape("Installing $distribution for WSL")) {
            throw "WSL reboot path continued into the $distribution install."
          }

          $global:wslCalls = [System.Collections.Generic.List[string]]::new()
          $global:wingetCalls = [System.Collections.Generic.List[string]]::new()
          git config --global user.name "packages-only-sentinel"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not set the Git sentinel before the Packages task."
          }
          [System.IO.File]::WriteAllText($inputLeapConfig, "sentinel")
          [System.IO.File]::WriteAllText($flowSettings, "sentinel")
          # A local install links this path at the repo file. Remove the link before writing the sentinel.
          Remove-Item -LiteralPath $glazeConfig -Force
          [System.IO.File]::WriteAllText($glazeConfig, "sentinel")
          [System.IO.File]::WriteAllText($zebarSettings, "sentinel")
          & ./install.ps1 Packages
          if ($global:wslCalls.Count -ne 0) {
            throw "The Packages task invoked WSL."
          }
          if ($global:wingetCalls.Count -ne $packages.Count) {
            throw "The Packages task did not install every package."
          }
          $gitName = git config --global --get user.name
          if ($gitName -ne "packages-only-sentinel") {
            throw "The Packages task changed the Git identity."
          }
          if ([System.IO.File]::ReadAllText($inputLeapConfig) -ne "sentinel") {
            throw "The Packages task changed the Input Leap layout."
          }
          if ([System.IO.File]::ReadAllText($flowSettings) -ne "sentinel") {
            throw "The Packages task changed the Flow Launcher settings."
          }
          if ([System.IO.File]::ReadAllText($glazeConfig) -ne "sentinel") {
            throw "The Packages task changed the GlazeWM config."
          }
          if ([System.IO.File]::ReadAllText($zebarSettings) -ne "sentinel") {
            throw "The Packages task changed the workspace bar."
          }

      - name: Verify packages exist in WinGet
        shell: pwsh
        run: |
          winget source update --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Could not update WinGet sources."
          }

          $packages = @(
            Get-Content ./config/packages.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )
          $node = Import-PowerShellDataFile ./config/node.psd1
          $packages += [string]$node.PackageId

          foreach ($id in $packages) {
            Write-Host "Checking $id"
            winget show --id $id --exact --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              throw "WinGet package '$id' could not be resolved."
            }
          }
