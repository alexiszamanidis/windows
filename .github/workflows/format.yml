---
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: alexiszamanidis/.github/.github/workflows/prettier.yml@master
    permissions:
      contents: write
    with:
      node-version: "24"
