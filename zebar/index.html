<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body,
            #bar {
                margin: 0;
                height: 100%;
                background: #282a36;
                color: #f8f8f2;
                font-family: "Segoe UI", sans-serif;
                font-size: 13px;
            }

            #bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                box-sizing: border-box;
            }

            #workspaces {
                display: flex;
                align-items: center;
                gap: 4px;
                min-width: 0;
            }

            #right {
                display: flex;
                align-items: center;
                gap: 12px;
                white-space: nowrap;
            }

            #resources {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #bfbfbf;
            }

            #resources span {
                font-variant-numeric: tabular-nums;
            }

            #resources .label {
                color: #6272a4;
                margin-right: 4px;
            }

            button {
                border: 0;
                background: #282a36;
                color: #bfbfbf;
                padding: 4px 10px;
                font: inherit;
                cursor: pointer;
            }

            button.displayed {
                background: #44475a;
                color: #f8f8f2;
            }

            button.focused {
                background: #6272a4;
                color: #f8f8f2;
            }

            #clock {
                color: #f8f8f2;
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <div id="workspaces"></div>
            <div id="right">
                <div id="resources">
                    <span id="cpu"><span class="label">CPU</span>--</span>
                    <span id="memory"><span class="label">MEM</span>--</span>
                </div>
                <div id="clock"></div>
            </div>
        </div>
        <script type="module">
            import * as zebar from "https://esm.sh/zebar@3";

            const providers = zebar.createProviderGroup({
                glazewm: { type: "glazewm" },
                cpu: { type: "cpu", refreshInterval: 2000 },
                memory: { type: "memory", refreshInterval: 2000 },
                date: { type: "date", formatting: "EEE dd-MM HH:mm" },
            });

            const workspaces = document.getElementById("workspaces");
            const cpuEl = document.getElementById("cpu");
            const memoryEl = document.getElementById("memory");
            const clock = document.getElementById("clock");

            function pct(value) {
                return Number.isFinite(value) ? `${Math.round(value)}%` : "--";
            }

            function render() {
                const output = providers.outputMap;
                const wm = output.glazewm;
                workspaces.replaceChildren();
                if (wm) {
                    for (const workspace of wm.currentWorkspaces) {
                        const button = document.createElement("button");
                        const focused =
                            wm.focusedWorkspace?.name === workspace.name;
                        const displayed =
                            wm.displayedWorkspace?.name === workspace.name;
                        button.className = focused
                            ? "focused"
                            : displayed
                            ? "displayed"
                            : "";
                        button.textContent =
                            workspace.displayName ?? workspace.name;
                        button.addEventListener("click", () => {
                            wm.runCommand(
                                `focus --workspace ${workspace.name}`
                            );
                        });
                        workspaces.appendChild(button);
                    }
                }

                cpuEl.innerHTML = `<span class="label">CPU</span>${pct(
                    output.cpu?.usage
                )}`;
                memoryEl.innerHTML = `<span class="label">MEM</span>${pct(
                    output.memory?.usage
                )}`;
                clock.textContent = output.date?.formatted ?? "";
            }

            providers.onOutput(render);
            render();
        </script>
    </body>
</html>
